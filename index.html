<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Assistant</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-gray-900 text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    function AIChat() {
      const [messages, setMessages] = useState([
        { role: "bot", text: "Hello! I'm Arun's AI Assistant. How can I help you today?" }
      ]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const bottomRef = useRef(null);

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages]);

      async function sendMessage() {
        if (!input.trim() || loading) return;

        const userMsg = { role: "user", text: input };
        setMessages(prev => [...prev, userMsg]);
        setInput("");
        setLoading(true);

        try {
          const res = await fetch("https://arun-ai-backend.vercel.app/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: userMsg.text })
          });

          const data = await res.json();

          setMessages(prev => [
            ...prev,
            { role: "bot", text: data.reply || "No response from AI." }
          ]);
        } catch (err) {
          setMessages(prev => [
            ...prev,
            { role: "bot", text: "Connection error. Please try again." }
          ]);
        } finally {
          setLoading(false);
        }
      }

      return (
        <div className="flex flex-col min-h-screen max-w-2xl mx-auto p-4">
          <h1 className="text-3xl font-bold text-center mb-4">AI Assistance</h1>

          <div className="flex-1 overflow-y-auto bg-gray-800 rounded-xl p-4 space-y-3">
            {messages.map((m, i) => (
              <div key={i} className={m.role === "user" ? "text-right" : "text-left"}>
                <span className={
  "inline-block px-4 py-2 rounded-2xl shadow text-sm " +
  (m.role === "user"
    ? "bg-blue-600 text-white rounded-br-none"
    : "bg-gray-700 text-gray-100 rounded-bl-none")
}>

                  {m.text}
                </span>
              </div>
            ))}
            {messages.length === 1 && (
  <div className="flex flex-wrap gap-2 mt-2">
    {[
      "Tell me about Arun’s FastAPI experience",
      "What GenAI projects has Arun built?",
      "Explain Arun’s backend architecture skills"
    ].map((q, i) => (
      <button
        key={i}
        onClick={() => setInput(q)}
        className="text-xs px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded-full"
      >
        {q}
      </button>
    ))}
  </div>
)}


            {loading && (
  <div className="flex gap-1 px-2 py-1">
    <span className="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></span>
    <span className="w-2 h-2 bg-gray-400 rounded-full animate-bounce [animation-delay:0.15s]"></span>
    <span className="w-2 h-2 bg-gray-400 rounded-full animate-bounce [animation-delay:0.3s]"></span>
  </div>
)}


            <div ref={bottomRef}></div>
          </div>

          <div className="flex gap-2 mt-3">
            <input
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && sendMessage()}
              placeholder="Message AI Assistant..."
              className="flex-1 px-4 py-2 rounded-lg bg-gray-700 focus:outline-none"
            />

            <button
              onClick={sendMessage}
              className="px-4 py-2 bg-blue-600 rounded-lg hover:bg-blue-500"
            >
              Send
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<AIChat />);
  </script>
</body>
</html>
